name: Deploy website to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ictmates-siteground-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://ictmates.com
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Test deployment protections
        run: python3 -m unittest discover -s tests -v
      - name: Test enquiry protections
        run: |
          node --test tests/ictmates-enquiry-email.test.mjs
          php tests/ictmates-enquiry-handler.test.php
      - name: Check form configuration
        run: test -n "$PUBLIC_TURNSTILE_SITE_KEY"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build static website
        run: npm run build
      - name: Package release
        run: python3 ops/build_release.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/ictmates-release.zip"
      - name: Check Cloudflare purge configuration
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: test -n "$CLOUDFLARE_CACHE_PURGE_TOKEN"
      - name: Deploy through restricted SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SITEGROUND_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          umask 077
          key="$RUNNER_TEMP/ictmates-siteground-key"
          config="$RUNNER_TEMP/ictmates-ssh-config"
          trap 'rm -f "$key" "$config"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          cat > "$config" <<EOF
          Host sg_ictmates
              HostName ams17.siteground.eu
              User u1211-yhjqvpyaiqyu
              Port 18765
              IdentityFile $key
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
              HostKeyAlgorithms ssh-ed25519
              UserKnownHostsFile $GITHUB_WORKSPACE/ops/siteground_known_hosts
              UpdateHostKeys no
              ConnectTimeout 30
              ServerAliveInterval 15
              ServerAliveCountMax 4
          EOF
          ssh -F "$config" sg_ictmates status > "$RUNNER_TEMP/receiver-status.json"
          python3 - "$RUNNER_TEMP/receiver-status.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          status = json.load(open(sys.argv[1]))
          expected = hashlib.sha256(Path('ops/deploy_receiver.py').read_bytes()).hexdigest()
          if not status.get('ready') or status.get('receiver_sha256') != expected:
              raise SystemExit('Installed deployment receiver does not match this checkout')
          print('Pinned SSH host key and installed receiver verified.')
          PY
          ssh -F "$config" sg_ictmates deploy < "$RUNNER_TEMP/ictmates-release.zip" | tee "$RUNNER_TEMP/deployment-result.json"
          python3 - "$RUNNER_TEMP/deployment-result.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          print('## Deployed to SiteGround')
          print('Commit: `' + result['commit'] + '`')
          print('\nProtected backup folders unchanged: ' + str(result['protected_unchanged']))
          for check in result['https']:
              print('\n- ' + check['url'] + ' — HTTP 200, matches release')
          PY
      - name: Refresh Cloudflare cache and verify public pages
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, time, urllib.error, urllib.request
          from pathlib import Path

          # Cloudflare Web Analytics may inject this beacon outside the EU.
          # Ignore only that known external script; all other HTML must match.
          beacon = re.compile(
              rb'<script type="module" src="https://static\.cloudflareinsights\.com/beacon\.min\.js/[A-Za-z0-9]+" '
              rb'integrity="sha512-[A-Za-z0-9+/=]+" '
              rb'data-cf-beacon=\'[^\'<>]+\' crossorigin="anonymous"></script>\n(?=</body>)')

          hosts = ('ictmates.com', 'www.ictmates.com')
          paths = ('/', '/index.html', '/why-wrenio', '/why-wrenio/', '/why-wrenio/index.html', '/partners', '/partners/', '/partners/index.html', '/contact', '/contact/', '/contact/index.html')
          urls = ['https://' + host + path for host in hosts for path in paths]
          request = urllib.request.Request(
              'https://api.cloudflare.com/client/v4/zones/b69ed4c08749b8d5a820fd2f96206ff3/purge_cache',
              data=json.dumps({'files': urls}).encode(), method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_CACHE_PURGE_TOKEN'],
                       'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          if result.get('success') is not True:
              raise SystemExit('Cloudflare cache purge failed')
          for host in hosts:
              for route, file in (('/', 'index.html'), ('/why-wrenio/', 'why-wrenio/index.html'),
                                  ('/partners/', 'partners/index.html'), ('/contact/', 'contact/index.html')):
                  url = 'https://' + host + route
                  expected = hashlib.sha256((Path('dist') / file).read_bytes()).digest()
                  public_request = urllib.request.Request(url, headers={
                      'User-Agent': 'ICTMates-Public-Verification/1.0'})
                  for attempt in range(5):
                      with urllib.request.urlopen(public_request, timeout=20) as response:
                          body = response.read()
                          actual = hashlib.sha256(beacon.sub(b'', body, count=1)).digest()
                          matches = response.status == 200 and actual == expected
                          if not matches and attempt in (0, 4):
                              print('Public check mismatch:', url, 'bytes=', len(body),
                                    'cache=', response.headers.get('CF-Cache-Status'),
                                    'ray=', response.headers.get('CF-Ray'),
                                    'expected=', expected.hex(), 'actual=', actual.hex(),
                                    'challenge=', b'/cdn-cgi/challenge-platform/' in body,
                                    'local_fonts=', b'/fonts/dm-sans-latin-v17.woff2' in body)
                      if matches:
                          print(url + ' — HTTP 200, matches release after Cloudflare purge')
                          break
                      if attempt == 4:
                          raise SystemExit('Public page does not match release after Cloudflare purge: ' + url)
                      time.sleep(3)
              # Confirm the endpoint executes on the host without sending an enquiry.
              endpoint = urllib.request.Request('https://' + host + '/api/enquiry.php',
                  headers={'User-Agent': 'ICTMates-Public-Verification/1.0'})
              try:
                  urllib.request.urlopen(endpoint, timeout=20)
                  raise SystemExit('ICT Mates enquiry endpoint must reject GET')
              except urllib.error.HTTPError as error:
                  if error.code != 405 or json.load(error).get('success') is not False:
                      raise SystemExit('ICT Mates enquiry endpoint is not running correctly')
              print(host + '/api/enquiry.php rejects GET as expected')
          PY
