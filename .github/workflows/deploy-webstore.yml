name: Deploy Webstore to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webstore-siteground-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: webstore-production
      url: https://webstore.pk
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_UNSTATIC_FORM_ID: ${{ vars.PUBLIC_UNSTATIC_FORM_ID }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Test deployment protections
        run: python3 -m unittest discover -s tests -v
      - name: Test enquiry delivery protections
        run: node --test tests/enquiry-email.test.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check form configuration
        run: |
          test -n "$PUBLIC_UNSTATIC_FORM_ID"
          test -n "$PUBLIC_TURNSTILE_SITE_KEY"
      - name: Build static website
        run: npm run build:webstore
      - name: Package release
        run: python3 ops/build_release.py --dist webstore/dist --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/webstore-release.zip"
      - name: Deploy through restricted SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SITEGROUND_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          umask 077
          key="$RUNNER_TEMP/webstore-siteground-key"
          config="$RUNNER_TEMP/webstore-ssh-config"
          trap 'rm -f "$key" "$config"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          cat > "$config" <<EOF
          Host sg_webstore
              HostName gnldm1057.siteground.biz
              User u1658-p7gizqmltgup
              Port 18765
              IdentityFile $key
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
              HostKeyAlgorithms ssh-ed25519
              UserKnownHostsFile $GITHUB_WORKSPACE/ops/webstore_siteground_known_hosts
              UpdateHostKeys no
              ConnectTimeout 30
              ServerAliveInterval 15
              ServerAliveCountMax 4
          EOF
          ssh -F "$config" sg_webstore status > "$RUNNER_TEMP/receiver-status.json"
          python3 - "$RUNNER_TEMP/receiver-status.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          status = json.load(open(sys.argv[1]))
          expected = hashlib.sha256(Path('ops/deploy_webstore_receiver.py').read_bytes()).hexdigest()
          if not status.get('ready') or status.get('receiver_sha256') != expected:
              raise SystemExit('Installed deployment receiver does not match this checkout')
          print('Pinned SSH host key and installed receiver verified.')
          PY
          ssh -F "$config" sg_webstore deploy < "$RUNNER_TEMP/webstore-release.zip" | tee "$RUNNER_TEMP/deployment-result.json"
          python3 - "$RUNNER_TEMP/deployment-result.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          print('## Deployed to SiteGround')
          print('Commit: `' + result['commit'] + '`')
          print('\nProtected backup folders unchanged: ' + str(result['protected_unchanged']))
          for check in result['https']:
              print('\n- ' + check['url'] + ' — HTTP 200, matches release')
          PY
      - name: Verify public pages and assets
        run: |
          python3 - <<'PY'
          import re, urllib.request
          from pathlib import Path
          # HTML bypasses Cloudflare caching; hashed assets use normal edge caching.
          # Ignore only the recognized Cloudflare analytics script, which can vary by region.
          beacon = re.compile(
              rb'<script type="module" src="https://static\.cloudflareinsights\.com/beacon\.min\.js/[A-Za-z0-9]+" '
              rb'integrity="sha512-[A-Za-z0-9+/=]+" '
              rb'data-cf-beacon=\'[^\'<>]+\' crossorigin="anonymous"></script>\n(?=</body>)')
          root = Path('webstore/dist')
          for host in ('webstore.pk', 'www.webstore.pk'):
              for file in sorted(root.rglob('*')):
                  if not file.is_file() or file.suffix == '.txt':
                      continue
                  path = file.relative_to(root).as_posix()
                  route = path[:-10] if path.endswith('index.html') else path
                  request = urllib.request.Request('https://' + host + '/' + route,
                      headers={'User-Agent': 'Webstore-Public-Verification/1.0'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 200 or beacon.sub(b'', response.read(), count=1) != file.read_bytes():
                          raise SystemExit('Public file differs from release: ' + path)
                  print(host + '/' + route + ' matches release')
          PY
